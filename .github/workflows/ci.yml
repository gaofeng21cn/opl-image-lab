name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix miniapp ci
      - run: npm --prefix miniapp run build
      - run: npm --prefix miniapp test
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- plugins/opl-image
